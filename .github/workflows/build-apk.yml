name: Build Pocket Pepakura Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare Godot templates and Android settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != "/root" ] && [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ "$HOME" != "/root" ] && [ -d /root/.local/share/godot/export_templates/4.6.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.6.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"
          test -f /root/debug.keystore

      - name: Validate Godot scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' godot-import.log; then
            echo 'Godot reported a script parsing error; no APK was exported.'
            exit 1
          fi

      - name: Export signed debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p dist
          godot --headless --path . --export-debug Android dist/PocketPepakura-v5-debug.apk 2>&1 | tee godot-export.log
          test -s dist/PocketPepakura-v5-debug.apk
          unzip -t dist/PocketPepakura-v5-debug.apk | tail -n 2

      - name: Downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPepakura-Android-debug
          path: dist/PocketPepakura-v5-debug.apk
          if-no-files-found: error
          retention-days: 30
